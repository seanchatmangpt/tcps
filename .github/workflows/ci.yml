name: tcps-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tcps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install exact test toolchain
        run: python -m pip install -e '.[test]'
      - name: Verify release candidate
        run: python scripts/release_verifier.py
      - name: Verify working tree remains source-clean
        run: git diff --exit-code

  projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Materialize exact ggen projector
        run: |
          git clone --filter=blob:none https://github.com/seanchatmangpt/ggen.git .ggen-projector
          git -C .ggen-projector checkout --detach 59c95cac18d49c62533918c906524be0fc4063ec
          test "$(git -C .ggen-projector rev-parse HEAD)" = "59c95cac18d49c62533918c906524be0fc4063ec"
      - name: Build projector
        run: cargo install --path .ggen-projector/crates/ggen-cli --locked
      - name: Replay ontology projection
        run: ggen sync --manifest ggen.toml --profile enterprise-strict --audit
      - name: Assert generated projections are current
        run: git diff --exit-code -- src/tcps/generated_contract.py generated_contract.md
